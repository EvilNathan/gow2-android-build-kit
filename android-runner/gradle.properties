org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
android.useAndroidX=true
org.gradle.parallel=true

# Boot ELF file name inside the app's external files dir (override with -Pps2xBootElfName=...).
ps2xBootElfName=SCUS_974.81
# Generated native VU1 blocks (scripts/gen-native.sh output, local-only, gitignored).
ps2xNativeVu1Dir=/home/hatch/workspace/gow2-android-build-kit/generated/vu1n
# M1: install the no-op GS backend; the real Vulkan backend replaces it in M2.
ps2xNullGs=ON
