plugins {
    id 'com.android.application'
}

android {
    namespace = "com.gow2.android"
    compileSdk 35
    ndkVersion = "27.3.13750724"

    defaultConfig {
        applicationId "com.gow2.android"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DANDROID_PLATFORM=android-26",
                        "-DCMAKE_C_FLAGS_DEBUG=-O3 -g", "-DCMAKE_CXX_FLAGS_DEBUG=-O3 -g -DNDEBUG"
                abiFilters 'arm64-v8a'
                cppFlags "-O3 -DNDEBUG"
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.30.5'
        }
    }

    packagingOptions {
        jniLibs {
            // Extract the library at install time. The ELF itself is built with
            // 16 KB LOAD alignment; extraction also keeps old and new page-size
            // devices happy when the APK is not ZIP-aligned to 16 KB.
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError = false
    }
}

dependencies {
}
