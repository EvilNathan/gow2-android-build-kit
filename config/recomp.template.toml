# Las funciones que Ghidra no ve (vfn_/cfn_/fn_ de tools/scan_missing_functions.py) van en config/funcmap.csv
# (tools/make_funcmap.py --extra), no aquí: ps2_recomp llama "entry_XXXX" a las de entry_points y no registra sus
# puntos de reanudación (docs/NOTES.md, "Blockers", fase 2).
entry_points = [
  # ps2_analyzer (base de símbolos de Sony): dentro de otra función según Ghidra
  "__sjpopnthrow@0x002C1838",
  "__eh_rtime_match@0x002C1950",
]

skip = []

