  "sceMpegAddStrCallback@0x002B01D8",
  "sceIpuStopDMA@0x002B53D8",
  "sceIpuRestartDMA@0x002B54C0",
  "sceIpuSync@0x002B5610",
  "sceIpuInit@0x002B56F0",
  "sceGsResetGraph@0x002B5928",
  "sceGsResetPath@0x002B5AC8",
  "sceGsSyncV@0x002B5B30",
  "sceGsSyncPath@0x002B5BC8",
  "memclr@0x002B5FE0",
