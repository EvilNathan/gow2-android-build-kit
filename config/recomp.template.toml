# Configuración de PS2Recomp para God of War II (SCUS_974.81 v1.01, SHA1 E6A62A0F3E781C29513F563F4625B9B3A9103C56).
# Modelo: referencia/gow1/config/recomp.template.toml. Las direcciones son de GoW II: las de GoW1 no valen aquí.
# recompile.ps1 rellena @ELF@, @MAP@ y @OUT@.

[general]
input = "@ELF@"
ghidra_output = "@MAP@"
output = "@OUT@"
single_file_output = false

# Como en GoW1: las syscalls se tratan por instrucción, no parcheando los envoltorios
patch_syscalls = false
patch_cop0 = true
patch_cache = true

# Funciones con manejador propio en el runtime: los stubs de GoW1, localizados en GoW II (SDK 3.0.0).
# Método y verificación de cada grupo en docs/NOTES.md, "Sony library stubs".
stubs = [
  "sceMpegCreate@0x002AB3E0",
  "sceMpegInit@0x002ABE88",
  "sceMpegGetPicture@0x002ABF48",
  "sceMpegGetPictureRAW8@0x002ABF90",
  "sceMpegReset@0x002ABFD8",
